
name: Build, Scan and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven Build and Test
        run: mvn clean verify

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: library

  docker:
    name: Build and Push Docker Image
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Verify Docker Hub Secrets
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -e
          test -n "$DH_USERNAME" || { echo "::error::DOCKERHUB_USERNAME missing"; exit 1; }
          test -n "$DH_TOKEN" || { echo "::error::DOCKERHUB_TOKEN missing"; exit 1; }

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            upparagovindu/ci-cd-devops-pipeline:latest
            upparagovindu/ci-cd-devops-pipeline:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: docker
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Verify EC2 Secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          test -n "$EC2_HOST" || { echo "::error::EC2_HOST missing"; exit 1; }
          test -n "$EC2_USERNAME" || { echo "::error::EC2_USERNAME missing"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "::error::EC2_SSH_KEY missing"; exit 1; }

      - name: Check EC2 SSH Port
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Checking EC2 SSH connectivity..."
          timeout 15 bash -c "cat < /dev/null > /dev/tcp/$EC2_HOST/22" || {
            echo "::error::EC2 port 22 is unreachable. Check EC2 network and Security Group."
            exit 1
          }
          echo "SSH port is reachable."

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e

            echo "Pulling latest application image..."
            sudo docker pull upparagovindu/ci-cd-devops-pipeline:latest

            echo "Creating Docker network if required..."
            sudo docker network inspect app-net >/dev/null 2>&1 || \
              sudo docker network create app-net

            echo "Starting MongoDB..."
            if ! sudo docker container inspect mongodb >/dev/null 2>&1; then
              sudo docker run -d \
                --name mongodb \
                --network app-net \
                -v mongodb_data:/data/db \
                --restart unless-stopped \
                mongo:7
            else
              sudo docker start mongodb
              sudo docker network connect app-net mongodb 2>/dev/null || true
            fi

            echo "Replacing Spring Boot application..."
            sudo docker rm -f spring-app 2>/dev/null || true

            sudo docker run -d \
              --name spring-app \
              --network app-net \
              -p 8080:8080 \
              -e SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/devopsdb \
              --restart unless-stopped \
              upparagovindu/ci-cd-devops-pipeline:latest

            echo "Checking running containers..."
            sudo docker ps

            echo "Checking application logs..."
            sudo docker logs --tail 50 spring-app

            echo "Deployment commands completed."
