
name: Build, Scan and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-scan-deploy:
    name: Build, Scan and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 3. Maven build and test
      - name: Maven Build and Test
        run: mvn clean verify

      # 4. Trivy filesystem security scan
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # 5. Verify Docker Hub secrets
      - name: Verify Docker Hub Secrets
        if: github.event_name == 'push'
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USERNAME" ]; then
            echo "::error::DOCKERHUB_USERNAME is missing"
            exit 1
          fi

          if [ -z "$DH_TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN is missing"
            exit 1
          fi

          echo "Docker Hub secrets are configured"

      # 6. Setup Docker Buildx
      - name: Setup Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # 7. Docker Hub login
      - name: Docker Hub Login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Build and push Docker image
      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            upparagovindu/ci-cd-devops-pipeline:latest
            upparagovindu/ci-cd-devops-pipeline:${{ github.sha }}

      # 9. Deploy to EC2
      - name: Deploy to EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Starting EC2 deployment..."

            # Pull latest image
            sudo docker pull upparagovindu/ci-cd-devops-pipeline:latest

            # Create application network if missing
            sudo docker network inspect app-net >/dev/null 2>&1 || \
              sudo docker network create app-net

            # Start MongoDB if it already exists
            if sudo docker container inspect mongodb >/dev/null 2>&1; then
              sudo docker start mongodb
            else
              sudo docker run -d \
                --name mongodb \
                --network app-net \
                -v mongodb_data:/data/db \
                --restart unless-stopped \
                mongo:7
            fi

            # Connect MongoDB to app network if needed
            sudo docker network connect app-net mongodb 2>/dev/null || true

            # Remove old Spring Boot container
            sudo docker rm -f spring-app 2>/dev/null || true

            # Deploy new Spring Boot container
            sudo docker run -d \
              --name spring-app \
              --network app-net \
              -p 8080:8080 \
              -e SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/devopsdb \
              --restart unless-stopped \
              upparagovindu/ci-cd-devops-pipeline:latest

            echo "Deployment completed"

            # Verify containers
            sudo docker ps

            # Check application logs
            sudo docker logs --tail 50 spring-app
