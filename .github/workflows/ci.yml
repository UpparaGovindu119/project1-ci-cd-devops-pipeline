
name: Enterprise CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  ENVIRONMENT: development
  DOCKER_IMAGE: upparagovindu/ci-cd-devops-pipeline

jobs:
  build-and-scan:
    name: Build, Test and Push
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Java 17 and Maven cache
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # 3. Display environment
      - name: Show Environment
        run: echo "Running in $ENVIRONMENT"

      # 4. Verify Java and Maven
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version

      # 5. Build and test
      - name: Build and Test Application
        run: mvn clean verify

      # 6. Trivy security scan
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      # 7. Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 8. Docker Hub login
      - name: Docker Hub Login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9. Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            upparagovindu/ci-cd-devops-pipeline:latest
            upparagovindu/ci-cd-devops-pipeline:${{ github.sha }}

      # 10. Deploy to AWS EC2
      - name: Deploy to AWS EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Checking Docker..."
            docker --version

            echo "Checking Docker network..."
            docker network inspect app-net >/dev/null 2>&1 || docker network create app-net

            echo "Checking MongoDB container..."
            docker inspect mongodb >/dev/null

            if [ "$(docker inspect -f '{{.State.Running}}' mongodb)" != "true" ]; then
              docker start mongodb
            fi

            echo "Connecting MongoDB to app-net..."
            docker network connect app-net mongodb 2>/dev/null || true

            echo "Pulling Docker image..."
            docker pull upparagovindu/ci-cd-devops-pipeline:${{ github.sha }}

            echo "Removing old container..."
            docker rm -f spring-app || true

            echo "Starting Spring Boot application..."
            docker run -d \
              --name spring-app \
              --restart unless-stopped \
              --network app-net \
              -p 8080:8080 \
              -e SPRING_DATA_MONGODB_URI="mongodb://mongodb:27017/devopsdb" \
              upparagovindu/ci-cd-devops-pipeline:${{ github.sha }}

            echo "Checking application..."
            docker ps --filter name=spring-app

            echo "Deployment completed!"
