
name: Build, Scan and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-scan-deploy:
    name: Build, Scan and Deploy
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven Build and Test
        run: mvn clean verify

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: library

      - name: Verify Required Secrets
        if: github.event_name == 'push'
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          test -n "$DH_USERNAME" || { echo "::error::DOCKERHUB_USERNAME missing"; exit 1; }
          test -n "$DH_TOKEN" || { echo "::error::DOCKERHUB_TOKEN missing"; exit 1; }
          test -n "$EC2_HOST" || { echo "::error::EC2_HOST missing"; exit 1; }
          test -n "$EC2_USERNAME" || { echo "::error::EC2_USERNAME missing"; exit 1; }
          test -n "$EC2_SSH_KEY" || { echo "::error::EC2_SSH_KEY missing"; exit 1; }
          echo "All required secrets are configured"

      - name: Setup Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub Login
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            upparagovindu/ci-cd-devops-pipeline:latest
            upparagovindu/ci-cd-devops-pipeline:${{ github.sha }}

      - name: Check EC2 SSH Connectivity
        if: github.event_name == 'push'
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Checking EC2 SSH port..."
          if ! timeout 10 bash -c "cat < /dev/null > /dev/tcp/$EC2_HOST/22"; then
            echo "::error::Cannot reach EC2 port 22. Check Security Group, NACL, route and EC2 status."
            exit 1
          fi
          echo "EC2 SSH port is reachable"

      - name: Deploy to EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e

            echo "Starting deployment"

            sudo docker pull upparagovindu/ci-cd-devops-pipeline:latest

            sudo docker network inspect app-net >/dev/null 2>&1 || \
              sudo docker network create app-net

            if sudo docker container inspect mongodb >/dev/null 2>&1; then
              sudo docker start mongodb
              sudo docker network connect app-net mongodb 2>/dev/null || true
            else
              sudo docker run -d \
                --name mongodb \
                --network app-net \
                -v mongodb_data:/data/db \
                --restart unless-stopped \
                mongo:7
            fi

            sudo docker rm -f spring-app 2>/dev/null || true

            sudo docker run -d \
              --name spring-app \
              --network app-net \
              -p 8080:8080 \
              -e SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/devopsdb \
              --restart unless-stopped \
              upparagovindu/ci-cd-devops-pipeline:latest

            echo "Deployment completed"

            sudo docker ps

            sudo docker logs --tail 50 spring-app
